<!doctype html>
<html lang="en" class="dark">
<head>
<base href="/mock/site/">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Your Show Mock</title>
<script src="../showcase/data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#16141d; --panel:#221f2c; --raised:#2a2633; --rail:#100e15; --line:#2e2a3a; --field:#3a3548;
  --bone:#f4f2f8; --muted:#a9a4b8; --chyron:#ffc531; --ink:#121018; --plate:#fff; --plate-muted:#4a4558;
  --live:#f2545b; --live-ink:#2a0a0c; --good:#35b5a5; --good-ink:#0e2b27;
  --plate-shadow:0 6px 18px rgba(0,0,0,.3); --sheet-shadow:0 -12px 30px rgba(0,0,0,.45); --scrim:rgba(8,6,12,.62);
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b0a0f}
body{font-family:Archivo,system-ui,sans-serif;color:var(--bone);background:#0b0a0f;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
::selection{background:var(--chyron);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:16px Archivo,system-ui,sans-serif;color:var(--bone)}
:focus-visible{outline:3px solid var(--chyron);outline-offset:2px}
img{display:block}
.cap{font-stretch:62%;font-weight:800;text-transform:uppercase;line-height:1;letter-spacing:.01em}
.num{font-stretch:62%;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex:none}

/* ---------- frame ---------- */
.phone{width:100%;max-width:390px;min-height:100vh;background:var(--ground);position:relative;overflow-x:clip}
@media(min-width:760px){body{padding:24px 0}.phone{min-height:844px;border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.6);outline:1px solid #2a2633;overflow:clip}}
#app{padding-bottom:110px}

/* ---------- top ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.mark{display:flex;align-items:center;font-size:22px}
.mark .o{color:transparent;-webkit-text-stroke:1.3px var(--bone)}
.mark .w{background:var(--bone);color:var(--ground);padding:3px 13px 3px 9px;margin:0 3px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);font-size:18px}
.me{display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:3px;position:relative;transition:background .2s}
.iconbtn:hover{background:var(--panel)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--live);border:2px solid var(--ground);transition:transform .3s var(--spring)}
.iconbtn .dot.gone{transform:scale(0)}
.av{border-radius:3px;display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none;font-stretch:62%;position:relative}
.av.on::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--ground)}
.stack{display:flex}.stack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--ground)}.stack .av:first-child{margin-left:0}
.hello{padding:8px 16px 0;font-size:15px;line-height:1.45;color:var(--muted)}
.hello strong{color:var(--bone);font-weight:600}
.couchline{margin:10px 16px 0;display:flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 8px;border-radius:3px;background:var(--panel);width:calc(100% - 32px);transition:background .2s}
.couchline:hover{background:var(--raised)}
.couchline b{flex:1;font-size:15px;font-weight:600}
.couchline small{color:var(--muted);font-size:13px}
.crest{width:30px;height:30px;border-radius:3px;background:var(--raised);position:relative;flex:none}
.crest i{position:absolute;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ground)}

/* ---------- section scaffolding ---------- */
.sec{margin-top:34px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin-bottom:12px;gap:12px}
.sh h2{font-size:24px}
.sh .link{color:var(--chyron);font-size:15px;font-weight:600;padding:8px 0;margin:-8px 0}
.sh .aside{font-size:13px;color:var(--muted)}

/* ---------- the guide ---------- */
.guide-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin:26px 0 10px}
.guide-h h2{font-size:24px}
.rolling{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600;height:32px}
.rolling i{width:7px;height:7px;border-radius:50%;background:var(--good);transition:background .3s}
.rolling.paused i{background:var(--field)}
.reel{display:flex;overflow-x:auto;position:relative;scrollbar-width:none;padding:2px 0 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 24px),transparent);cursor:grab}
.reel::-webkit-scrollbar{display:none}
.reel.drag{cursor:grabbing;user-select:none}
.day{flex:none;width:162px;padding:0 5px;display:flex;flex-direction:column;gap:7px;border-left:1px solid var(--line)}
.day:first-child{border-left:0;padding-left:16px;width:173px}
.dh{display:flex;align-items:baseline;gap:6px;padding:2px 3px 4px;white-space:nowrap;height:24px}
.dh b{font-size:17px;font-stretch:62%;font-weight:800;text-transform:uppercase}
.dh span{font-size:12px;color:var(--muted);font-weight:600}
.day.today .dh b{background:var(--chyron);color:var(--ink);padding:3px 12px 2px 6px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.lst{position:relative;border-radius:3px;height:104px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;color:#fff;isolation:isolate;transition:transform .3s var(--spring),box-shadow .3s;background:var(--panel)}
.lst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s var(--ease)}
.lst::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,8,14,.15) 0%,rgba(10,8,14,.55) 48%,rgba(10,8,14,.92) 100%)}
.lst:hover img{transform:scale(1.06)}
.lst:active{transform:scale(.97)}
.lst .tm{position:absolute;top:7px;left:8px;font-size:11px;font-weight:800;background:rgba(10,8,14,.72);backdrop-filter:blur(4px);padding:3px 6px;border-radius:2px;display:flex;align-items:center;gap:5px}
.lst .tt{font-size:17px;font-stretch:62%;font-weight:800;text-transform:uppercase;line-height:.95;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.lst .ep{font-size:11px;font-weight:600;opacity:.85;margin-top:3px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.lst .f{display:flex}
.lst .f span{width:14px;height:14px;border-radius:2px;margin-left:-3px;box-shadow:0 0 0 1.5px rgba(10,8,14,.9);font-size:8px;font-weight:800;display:grid;place-items:center;color:var(--ink)}
.lst .nd{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.lst.watch{outline:1.5px dashed rgba(255,255,255,.45);outline-offset:-1.5px}
.lst.watch img{filter:saturate(.35) brightness(.8)}
.lst.sel{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--chyron)}
.lst.live .tm{background:var(--live);color:var(--live-ink)}
.lst.live .tm::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.clash{position:relative;display:flex;flex-direction:column;gap:5px;padding-left:8px;border-left:3px solid var(--chyron);border-radius:0}
.clash>em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-stretch:62%;color:var(--chyron);display:flex;justify-content:space-between;height:12px}
.clash .lst{height:86px}
.nowln{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--chyron);letter-spacing:.06em;text-transform:uppercase;font-stretch:62%;height:14px}
.nowln::after{content:"";flex:1;height:2px;background:var(--chyron)}
.quiet{font-size:13px;color:var(--field);height:56px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:3px}
.guide-f{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 0;font-size:13px;color:var(--muted)}
.guide-f button{color:var(--chyron);font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;height:40px}

/* ---------- hero ---------- */
.hero{margin:16px 16px 0;position:relative;border-radius:4px;overflow:hidden;min-height:330px;isolation:isolate;box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column}
.hero .art{position:absolute;inset:0;z-index:-2;overflow:hidden}
.hero .art img{width:100%;height:100%;object-fit:cover;animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.14) translate(-3%,-2%)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(16,14,21,.25) 0%,rgba(16,14,21,.2) 30%,rgba(16,14,21,.88) 72%,rgba(16,14,21,.97) 100%)}
.hero .in{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
.onnext{display:flex;align-items:center;gap:8px}
.onnext .tg{background:var(--chyron);color:var(--ink);font-size:13px;letter-spacing:.06em;padding:5px 18px 5px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.onnext span{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero h1{font-size:44px;margin-top:auto;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.cd{display:flex;gap:5px;align-items:flex-end}
.cd .u{display:flex;flex-direction:column;align-items:center;gap:3px}
.cd .u b{font-size:30px;background:rgba(16,14,21,.6);backdrop-filter:blur(6px);border-radius:3px;padding:5px 6px 3px;min-width:44px;text-align:center;font-weight:800;font-stretch:62%;font-variant-numeric:tabular-nums}
.cd .u small{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.7);font-weight:700;text-transform:uppercase}
.cd .sep{font-size:24px;padding-bottom:18px;opacity:.5;font-weight:800}
.cd b.fl{animation:flip .45s var(--ease)}
@keyframes flip{from{transform:translateY(-40%);opacity:.2}}
.todo{display:flex;align-items:stretch;background:var(--plate);color:var(--ink);border-radius:3px;min-height:56px;overflow:hidden;box-shadow:var(--plate-shadow);width:100%;transition:transform .25s var(--spring),filter .2s}
.todo:hover{filter:brightness(1.04)}.todo:active{transform:scale(.98)}
.todo .tg{background:var(--chyron);display:flex;align-items:center;padding:0 22px 0 11px;font-size:14px;letter-spacing:.04em;clip-path:polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%);margin-right:-13px;white-space:nowrap}
.todo .tg.good{background:var(--good);color:var(--good-ink)}.todo .tg.q{background:var(--raised);color:var(--bone)}
.todo .bd{flex:1;padding:7px 10px 7px 20px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.todo .t{font-size:19px}.todo .d{font-size:13px;color:var(--plate-muted)}
.todo .go{display:grid;place-items:center;padding:0 12px}
.crowd{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.88)}
.crowd .av{width:24px;height:24px;font-size:11px}
.crowd .more{background:var(--raised);color:var(--bone)}
.hero.swap .in>*{animation:rise .55s var(--ease) both}
.hero.swap .in>*:nth-child(2){animation-delay:.05s}.hero.swap .in>*:nth-child(3){animation-delay:.1s}.hero.swap .in>*:nth-child(4){animation-delay:.15s}.hero.swap .in>*:nth-child(5){animation-delay:.2s}
.hero.swap .art{animation:fadein .7s var(--ease) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes fadein{from{opacity:0;transform:scale(1.05)}}

/* ---------- posters ---------- */
.shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 18px;scroll-snap-type:x mandatory;scrollbar-width:none;perspective:900px}
.shelf::-webkit-scrollbar{display:none}
.poster{flex:none;width:164px;height:232px;scroll-snap-align:start;position:relative;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.poster.flip{transform:rotateY(180deg)}
.poster.pop{animation:popin .6s var(--spring)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.face{position:absolute;inset:0;border-radius:4px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 12px 26px rgba(0,0,0,.45)}
.front{display:flex;flex-direction:column;justify-content:flex-end;padding:11px;text-align:left;width:100%;color:#fff;isolation:isolate}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.front::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,8,14,0) 35%,rgba(10,8,14,.9) 100%)}
.front .glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.22),transparent 55%);mix-blend-mode:soft-light;pointer-events:none}
.front .ttl{font-size:28px;line-height:.92}
.front .sn{font-size:12px;font-weight:600;opacity:.88;margin-top:4px}
.front .badge{position:absolute;top:9px;left:9px;background:var(--plate);color:var(--ink);font-size:12px;padding:4px 12px 4px 7px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.front .badge.ex{background:rgba(10,8,14,.78);color:#fff}
.front .need{position:absolute;top:11px;right:11px;width:10px;height:10px;border-radius:50%;background:var(--live)}
.front .need::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--live);animation:ring 1.8s var(--ease) infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.8);opacity:0}}
.front .games{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.front .games span{font-size:10px;font-weight:700;background:rgba(10,8,14,.6);padding:3px 5px;border-radius:2px;backdrop-filter:blur(4px)}
.front .rate{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:700}
.front .rate svg{width:13px;height:13px;fill:var(--chyron);stroke:none}
.flipcue{position:absolute;bottom:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(10,8,14,.55);display:grid;place-items:center}
.flipcue svg{width:14px;height:14px}
.rear{transform:rotateY(180deg);background:var(--panel);padding:11px;display:flex;flex-direction:column;outline:1px solid var(--line);outline-offset:-1px}
.rear .bt{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.rear .bt b{font-size:17px}
.rear .unflip{width:36px;height:36px;display:grid;place-items:center;margin:-6px -6px 0 0;border-radius:3px}
.rear .unflip:hover{background:var(--raised)}
.rear .gm{display:flex;align-items:center;justify-content:space-between;min-height:44px;border-top:1px solid var(--line);font-size:14px;font-weight:600;width:100%}
.rear .gm small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.rear .gm .pl{font-size:22px}.rear .gm .pl.first{color:var(--chyron)}
.rear .open{margin-top:auto;height:40px;background:var(--bone);color:var(--ink);border-radius:3px;font-weight:700;font-size:14px;text-align:center}
.poster.add .front{background:none;outline:2px dashed var(--field);outline-offset:-2px;box-shadow:none;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--muted)}
.poster.add .front::before{display:none}
.plusbox{width:52px;height:52px;border-radius:3px;background:var(--panel);display:grid;place-items:center;color:var(--chyron);transition:transform .3s var(--spring)}
.poster.add:hover .plusbox{transform:rotate(90deg)}
.poster.add strong{color:var(--bone);font-size:22px}

/* ---------- rankings ---------- */
.tabs{display:flex;gap:3px;background:var(--panel);border-radius:3px;padding:3px;margin:0 16px 12px;position:relative}
.tabs button{flex:1;height:38px;border-radius:2px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;position:relative;z-index:1;transition:color .25s}
.tabs button.on{color:var(--ink)}
.tabs .pill{position:absolute;top:3px;bottom:3px;border-radius:2px;background:var(--bone);transition:transform .35s var(--ease),width .35s var(--ease)}
.pane{padding:0 16px;min-height:290px}
.pane.swap{animation:rise .4s var(--ease)}
.prow{display:grid;grid-template-columns:24px 32px minmax(0,1fr) 46px;align-items:center;gap:10px;height:52px;position:relative;border-top:1px solid var(--line)}
.prow .rk{font-size:22px;color:var(--muted)}.prow.lead .rk{color:var(--chyron)}
.prow .av{width:32px;height:32px;font-size:15px}
.prow .mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.prow .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.you{background:var(--bone);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 5px;border-radius:2px}
.bar{height:6px;border-radius:1px;background:var(--line);overflow:hidden;display:flex}
.bar i{height:100%;transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease)}
.in .bar i{transform:scaleX(1)}
.prow .pts{font-size:24px;text-align:right}
.prow .mv{position:absolute;right:50px;top:8px;font-size:10px;font-weight:700}
.mv.up{color:var(--good)}.mv.dn{color:var(--muted)}
.prow.me{background:var(--raised);margin:0 -8px;padding:0 8px;border-color:transparent;border-radius:2px}
.gapline{display:flex;align-items:center;gap:8px;height:30px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.gapline::before,.gapline::after{content:"";flex:1;border-top:1px dashed var(--field)}
.legend{display:flex;gap:14px;padding:10px 0 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:5px;vertical-align:-1px}
.callout{margin-top:14px;padding:12px 14px;background:var(--panel);border-radius:3px;font-size:14px;line-height:1.45;display:flex;gap:10px}
.callout svg{color:var(--chyron);margin-top:1px}
.alltime{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.alltime div{background:var(--panel);border-radius:3px;padding:12px 10px}
.alltime b{display:block;font-size:34px}
.alltime small{font-size:12px;color:var(--muted)}
.h2h{display:grid;grid-template-columns:32px minmax(0,1fr) 54px;gap:10px;align-items:center;height:56px;border-top:1px solid var(--line)}
.h2h .av{width:32px;height:32px;font-size:15px}
.h2h .vs{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--line)}
.h2h .vs i{height:100%;transform-origin:left;transform:scaleX(0);transition:transform .9s var(--ease)}
.in .h2h .vs i{transform:scaleX(1)}
.h2h .rec{text-align:right;font-size:20px}
.h2h .nm{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.h2h .nm small{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- feed ---------- */
.feed{padding:0 16px;display:flex;flex-direction:column}
.ev{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ev.new{animation:dropin .55s var(--ease)}
@keyframes dropin{from{transform:translateY(-12px);opacity:0}}
.ev .av{width:34px;height:34px;font-size:15px}
.ev .tx{flex:1;font-size:14px;line-height:1.4;min-width:0}
.ev .tx b{font-weight:700}
.ev .ctx{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ev .q{display:block;margin-top:5px;background:var(--panel);padding:8px 10px;border-radius:3px;font-size:15px}
.ev .thumb{width:44px;height:44px;border-radius:3px;object-fit:cover;flex:none}
.reacts{display:flex;gap:6px;margin-top:7px}
.reacts button{height:30px;padding:0 9px;border-radius:2px;background:var(--panel);font-size:13px;display:flex;align-items:center;gap:5px;font-weight:600;transition:transform .25s var(--spring)}
.reacts button.mine{outline:1.5px solid var(--chyron);outline-offset:-1.5px}
.reacts button.bump{animation:bump .4s var(--spring)}
@keyframes bump{50%{transform:scale(1.25)}}
.reacts svg{width:14px;height:14px}
.typing{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.2;transform:translateY(-2px)}}

/* ---------- commercial break ---------- */
.cb-head{margin:0 16px 12px;display:flex;align-items:center;gap:10px}
.cb-head .bars{display:flex;gap:2px;height:22px}
.cb-head .bars i{width:5px;height:100%}
.cb-head h2{font-size:24px}
.minis{display:flex;gap:10px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.minis::-webkit-scrollbar{display:none}
.mini{flex:none;width:200px;border-radius:4px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;text-align:left;outline:1px solid var(--line);outline-offset:-1px;scroll-snap-align:start;transition:transform .3s var(--spring)}
.mini:hover{transform:translateY(-3px)}.mini:active{transform:scale(.97)}
.mini .pic{height:96px;position:relative;overflow:hidden}
.mini .pic img{width:100%;height:100%;object-fit:cover}
.mini .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(34,31,44,.95))}
.mini .badge{position:absolute;left:10px;bottom:-14px;z-index:1;width:40px;height:40px;border-radius:3px;display:grid;place-items:center;color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.mini .live{position:absolute;top:8px;right:8px;z-index:1;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--live);color:var(--live-ink);padding:3px 6px;border-radius:2px;font-stretch:62%}
.mini .b{padding:20px 12px 12px;display:flex;flex-direction:column;gap:4px}
.mini strong{font-size:16px;font-weight:700}
.mini small{font-size:12px;color:var(--muted);line-height:1.35}

/* ---------- trophies ---------- */
.trophies{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 0;scrollbar-width:none}
.trophies::-webkit-scrollbar{display:none}
.tro{flex:none;width:124px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:4px;background:linear-gradient(180deg,var(--panel),var(--ground));position:relative;overflow:hidden;transition:transform .3s var(--spring)}
.tro:hover{transform:translateY(-3px)}
.tro .cup{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.tro .cup svg{width:32px;height:32px;stroke-width:1.8}
.tro.gold .cup{background:radial-gradient(circle,rgba(255,197,49,.25),transparent 70%);color:var(--chyron)}
.tro.gold::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,197,49,.14) 50%,transparent 70%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.tro strong{font-size:16px}
.tro small{font-size:12px;color:var(--muted);line-height:1.3}
.tro .pl{font-size:13px;font-weight:700}.tro.gold .pl{color:var(--chyron)}
.tro .rib{font-size:12px;font-weight:700;color:var(--good)}
.shelfline{height:6px;margin:0 16px;background:linear-gradient(180deg,#2e2a3a,#1b1822);border-radius:0 0 2px 2px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.foot{margin:34px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:52px;border-radius:3px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:filter .2s,transform .2s var(--spring)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.out{background:var(--panel);outline:1px solid var(--field);outline-offset:-1px}
.btn.pri{background:var(--chyron);color:var(--ink)}
.btn.ink{background:var(--bone);color:var(--ink)}
.btn:disabled{background:var(--raised);color:var(--muted);outline:0;cursor:default;filter:none}
.btn.wide{width:100%}

/* ---------- sheet + page system ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:51;width:100%;max-width:390px;max-height:90vh;display:flex;flex-direction:column;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:var(--sheet-shadow);transform:translate(-50%,105%);transition:transform .38s var(--ease)}
.sheet.on{transform:translate(-50%,0)}
.sheet.drag{transition:none}
.sheet .grab{padding:10px 0 6px;cursor:grab;touch-action:none;flex:none}
.sheet .grab i{display:block;width:40px;height:4px;border-radius:2px;background:var(--field);margin:0 auto}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 16px 10px;flex:none}
.sheet .sh-h h3{font-size:26px}
.sheet .sh-h small{display:block;font-size:13px;color:var(--muted);font-weight:500;font-stretch:100%;text-transform:none;letter-spacing:0;margin-top:5px}
.sheet .x{width:40px;height:40px;display:grid;place-items:center;border-radius:3px;flex:none}
.sheet .x:hover{background:var(--raised)}
.sheet .body{overflow-y:auto;padding:0 16px 22px;scrollbar-width:thin;scrollbar-color:var(--field) transparent}
.page{position:fixed;top:0;bottom:0;left:50%;z-index:45;width:100%;max-width:390px;background:var(--ground);overflow-y:auto;transform:translate(calc(-50% + 100%),0);transition:transform .45s var(--ease);visibility:hidden;scrollbar-width:none}
.page.on{transform:translate(-50%,0);visibility:visible}
.page::-webkit-scrollbar{display:none}
@media(min-width:760px){.page{top:24px;bottom:24px;border-radius:30px}.sheet{border-radius:14px 14px 30px 30px;bottom:24px}}
.pg-h{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;background:rgba(22,20,29,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pg-h h3{font-size:20px;flex:1}
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;font-size:15px;font-weight:600;border-radius:3px}
.back:hover{background:var(--panel)}
.back svg{transform:rotate(180deg)}
.toast{position:fixed;left:50%;top:14px;z-index:70;transform:translate(-50%,-160%);width:calc(100% - 32px);max-width:358px;background:var(--plate);color:var(--ink);border-radius:3px;display:flex;align-items:stretch;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:transform .5s var(--spring)}
.toast.on{transform:translate(-50%,0)}
.toast .t{background:var(--good);color:var(--good-ink);display:grid;place-items:center;padding:0 16px 0 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);margin-right:-10px}
.toast span{padding:12px 12px 12px 18px;font-size:14px;font-weight:600}

/* sheet content pieces */
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .ic{width:40px;height:40px;border-radius:3px;background:var(--raised);display:grid;place-items:center;flex:none;overflow:hidden}
.row .ic img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:600}
.row .tx small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.row .when{font-size:12px;color:var(--muted);white-space:nowrap}
.row.unread .tx b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--chyron);margin-left:7px;vertical-align:2px}
.label{font-size:13px;color:var(--muted);letter-spacing:.06em;margin:18px 0 8px}
.members{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.mem{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.mem .av{width:52px;height:52px;font-size:22px}
.mem.add .av{background:none;outline:1.5px dashed var(--field);outline-offset:-1.5px;color:var(--muted)}
.code{display:flex;align-items:center;gap:10px;background:var(--plate);color:var(--ink);border-radius:3px;padding:12px 14px;margin-top:4px}
.code b{font-size:40px;letter-spacing:.14em;flex:1}
.code button{height:40px;padding:0 14px;border-radius:3px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:2px;background:var(--line)}
.tl{position:relative;padding:10px 0}
.tl::before{content:"";position:absolute;left:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--field)}
.tl.now::before{background:var(--chyron);border-color:var(--chyron);box-shadow:0 0 0 5px rgba(255,197,49,.15)}
.tl.next::before{border-style:dashed}
.tl b{font-size:19px}
.tl small{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.tl .btn{height:40px;margin-top:8px;padding:0 14px;display:inline-flex}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:3px;background:var(--ground);border:1px solid var(--field);margin-bottom:12px}
.search:focus-within{border-color:var(--chyron);box-shadow:0 0 0 3px rgba(255,197,49,.18)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.artgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.artcard{position:relative;aspect-ratio:16/11;border-radius:4px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;color:#fff;isolation:isolate;transition:transform .3s var(--spring)}
.artcard:active{transform:scale(.97)}
.artcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.artcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(10,8,14,.9))}
.artcard b{font-size:17px}.artcard small{font-size:11px;opacity:.85;margin-top:2px}
.artcard .chk{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(10,8,14,.6);display:grid;place-items:center;transition:background .25s,transform .4s var(--spring)}
.artcard.on .chk{background:var(--good);color:var(--good-ink);transform:scale(1.12)}
.artcard.on{box-shadow:0 0 0 3px var(--good)}
.artcard.blank{background:linear-gradient(135deg,#2a2633,#3a3548)}
.artcard.blank::before{display:none}
.artcard.blank b{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--plate);color:var(--ink);border-radius:3px;overflow:hidden;box-shadow:var(--plate-shadow);position:relative;text-align:left;transition:transform .3s var(--spring)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 20%}
.tile div{padding:6px 7px 2px;font-size:15px}
.tile small{display:block;font-size:11px;color:var(--plate-muted);padding:0 7px 7px;font-weight:600}
.tile.new{animation:popin .55s var(--spring)}
.tile.sel{outline:3px solid var(--chyron);outline-offset:2px;transform:translateY(-3px)}
.tile .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--chyron);display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--spring)}
.tile.sel .tick{transform:scale(1)}
.slot{border:2px dashed #4a4558;border-radius:3px;display:grid;place-items:center;color:var(--muted);font-size:13px;aspect-ratio:1/1.32;text-align:center}
.bench{display:flex;align-items:center;gap:12px;min-height:62px;border-top:1px solid var(--line)}
.bench img{width:46px;height:46px;object-fit:cover;object-position:center 20%;border-radius:2px}
.bench .tx{flex:1}.bench .tx b{display:block;font-size:15px;font-weight:600}.bench .tx small{font-size:12px;color:var(--muted)}
.bench button{height:38px;padding:0 14px;border-radius:3px;background:var(--chyron);color:var(--ink);font-weight:700;font-size:14px}
.bench button:disabled{background:var(--raised);color:var(--muted)}
.cast4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cast4 .tile div{font-size:13px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;position:relative}
.sq{aspect-ratio:1;border-radius:3px;background:var(--raised);font-size:10px;line-height:1.15;font-weight:600;padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;transition:transform .25s var(--spring),background .2s;overflow-wrap:anywhere}
.sq.m{background:var(--chyron);color:var(--ink)}
.sq.m::after{content:"";position:absolute;inset:4px;border:2px solid rgba(18,16,24,.45);border-radius:50%;animation:stamp .35s var(--spring)}
@keyframes stamp{from{transform:scale(1.6);opacity:0}}
.sq.free{background:var(--bone);color:var(--ink);font-weight:800;font-stretch:62%;font-size:14px;text-transform:uppercase}
.sq.win{animation:win .6s var(--spring)}
@keyframes win{50%{transform:scale(1.14)}}
.bingo-banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.bingo-banner.on{animation:banner 1.8s var(--ease)}
@keyframes banner{0%{opacity:0;transform:scale(.7)}18%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}
.bingo-banner span{background:var(--chyron);color:var(--ink);font-size:52px;padding:10px 38px 8px 18px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.vote{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 12px 0 8px;border-radius:3px;background:var(--raised);margin-bottom:8px;width:100%;overflow:hidden;text-align:left}
.vote img{width:44px;height:44px;border-radius:2px;object-fit:cover;object-position:center 20%;position:relative;z-index:1}
.vote b{flex:1;font-size:16px;font-weight:600;position:relative;z-index:1}
.vote .pct{font-size:22px;position:relative;z-index:1;opacity:0;transition:opacity .4s .3s}
.vote .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,197,49,.16);transition:width .9s var(--ease)}
.vote.mine{outline:2px solid var(--chyron);outline-offset:-2px}
.voted .vote .pct{opacity:1}
.voted .vote{cursor:default}
.q-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.q-opt{min-height:56px;border-radius:3px;background:var(--raised);padding:0 14px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;width:100%;transition:background .25s,transform .25s var(--spring)}
.q-opt img{width:40px;height:40px;border-radius:2px;object-fit:cover;object-position:center 20%}
.q-opt.right{background:var(--good);color:var(--good-ink)}
.q-opt.wrong{background:var(--live);color:var(--live-ink);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qprog{display:flex;gap:4px;margin-bottom:14px}
.qprog i{flex:1;height:4px;border-radius:1px;background:var(--line)}
.qprog i.on{background:var(--chyron)}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:2px;background:var(--raised);font-size:14px;font-weight:600;margin:0 6px 6px 0;transition:background .2s}
.chip.on{background:var(--bone);color:var(--ink)}
.codein{display:flex;gap:6px;justify-content:center;margin:14px 0}
.codein input{width:44px;height:56px;border-radius:3px;background:var(--ground);border:1px solid var(--field);text-align:center;font:800 26px Archivo;font-stretch:62%;text-transform:uppercase;outline:0}
.codein input:focus{border-color:var(--chyron);box-shadow:0 0 0 3px rgba(255,197,49,.18)}
.codein.bad input{border-color:var(--live);animation:shake .4s}
.codein.ok input{border-color:var(--good);background:rgba(53,181,165,.12)}
.typecard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:3px;background:var(--raised);margin-bottom:8px;width:100%;text-align:left;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .2s}
.typecard.on{outline-color:var(--chyron);background:var(--plate);color:var(--ink)}
.typecard.on small{color:var(--plate-muted)}
.typecard b{display:block;font-size:16px}
.typecard small{font-size:13px;color:var(--muted)}
.steps3{display:flex;gap:4px;margin-bottom:14px}
.steps3 i{flex:1;height:4px;border-radius:1px;background:var(--line);transition:background .3s}
.steps3 i.on{background:var(--chyron)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--raised);border-radius:3px;padding:12px 10px}
.stat3 b{display:block;font-size:30px}
.stat3 small{font-size:12px;color:var(--muted)}
.recap-art{height:150px;border-radius:4px;overflow:hidden;position:relative;margin-bottom:12px}
.recap-art img{width:100%;height:100%;object-fit:cover}
.recap-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(34,31,44,.95))}
.recap-art b{position:absolute;left:12px;bottom:10px;z-index:1;font-size:30px}
.srow{display:flex;align-items:center;gap:10px;height:48px;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.srow .r{width:22px;font-size:22px;color:var(--muted)}.srow.lead .r{color:var(--chyron)}
.srow .d{width:10px;height:10px;border-radius:50%}
.srow .t{margin-left:auto;font-size:24px}
.srow.me{background:var(--raised);margin:0 -8px;padding:0 8px;border-color:transparent}

/* chat page */
.chat{padding:12px 16px 90px;display:flex;flex-direction:column;gap:2px}
.dayl{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-stretch:62%;margin:12px 0 6px}
.dayl::before,.dayl::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.msg .av{width:28px;height:28px;font-size:12px}
.msg .bub{max-width:78%;background:var(--panel);padding:8px 11px;border-radius:4px;font-size:15px;line-height:1.35}
.msg .bub small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.msg.mine{justify-content:flex-end}
.msg.mine .bub{background:var(--bone);color:var(--ink)}
.msg.new{animation:rise .3s var(--ease)}
.fold{border:1px dashed var(--field);border-radius:4px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;width:100%;margin-top:6px}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 16px 16px;background:rgba(22,20,29,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;height:46px;border-radius:3px;background:var(--panel);border:1px solid var(--field);padding:0 12px;outline:0}
.composer input:focus{border-color:var(--chyron)}
.composer button{width:46px;height:46px;border-radius:3px;background:var(--raised);display:grid;place-items:center;transition:background .2s}
.composer button.ready{background:var(--chyron);color:var(--ink)}

/* show page + watch along (kept from v1) */
.sp-hero{position:relative;height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;overflow:hidden;isolation:isolate}
.sp-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.sp-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(22,20,29,.2),rgba(22,20,29,.65) 60%,var(--ground))}
.sp-hero .back{position:absolute;top:12px;left:10px;background:rgba(16,14,21,.6);backdrop-filter:blur(8px)}
.sp-hero h1{font-size:44px}
.sp-hero .sub{font-size:14px;color:rgba(255,255,255,.88);margin-top:6px}
.where{margin:0 16px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-radius:3px;font-size:14px}
.where svg{color:var(--good)}
.where strong{flex:1;font-weight:600}
.where button{color:var(--chyron);font-weight:600;height:32px}
.watchers{display:flex;align-items:center;gap:10px;margin:14px 16px 0;font-size:14px;color:var(--muted)}
.watchers .av{width:24px;height:24px;font-size:11px}
.scrubber{margin:4px 16px 0;display:flex;align-items:center;gap:12px}
.scrubber input{flex:1;accent-color:var(--chyron);height:28px}
.scrubber .num{font-size:20px;width:44px;text-align:right}
.lb{position:relative;margin:6px 16px 0}
.lrow{position:absolute;left:0;right:0;height:56px;display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto 40px;align-items:center;gap:10px;border-top:1px solid var(--line);transition:transform .6s var(--ease),opacity .4s}
.lrow .rk{font-size:20px;color:var(--muted)}.lrow.lead1 .rk{color:var(--chyron)}

const av=(n,s=32,on)=>`<span class="av${on?' on':''}" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.46)}px;background:${col(n)}">${n[0].toUpperCase()}</span>`;

function nextAir([d,h,m]){const n=new Date(),t=new Date(n);t.setHours(h,m,0,0);let add=(d-n.getDay()+7)%7;if(add===0&&t<=n)add=7;t.setDate(n.getDate()+add);return t}
const clock=t=>`${((t.getHours()+11)%12)+1}:${String(t.getMinutes()).padStart(2,'0')} ${t.getHours()<12?'AM':'PM'}`;
const fmtT=t=>`${DAY[t.getDay()]} ${clock(t)}`;
const startOfToday=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

// ================= sheet / page / toast =================
const UI={stack:[]};
function openSheet(title,sub,body,onMount){
  const sh=$('sheet');sh.innerHTML=`<div class="grab" id="grab"><i></i></div><div class="sh-h"><div><h3 class="cap">${title}</h3>${sub?`<small>${sub}</small>`:''}</div><button class="x" data-close aria-label="Close">${svg('x')}</button></div><div class="body">${body}</div>`;
  sh.setAttribute('aria-label',title);$('scrim').classList.add('on');requestAnimationFrame(()=>sh.classList.add('on'));UI.sheet=true;syncCtl();
  sh.querySelector('[data-close]').onclick=closeSheet;dragToClose(sh);onMount&&onMount(sh.querySelector('.body'));setTimeout(()=>sh.querySelector('[data-close]').focus({focusVisible:false}),50);
}
function closeSheet(){$('sheet').classList.remove('on');if(!UI.page)$('scrim').classList.remove('on');UI.sheet=false;syncCtl()}
function dragToClose(sh){const g=$('grab');let y0=null,dy=0;
  g.onpointerdown=e=>{y0=e.clientY;sh.classList.add('drag');g.setPointerCapture(e.pointerId)};
  g.onpointermove=e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translate(-50%,${dy}px)`};
  g.onpointerup=()=>{sh.classList.remove('drag');sh.style.transform='';if(dy>90)closeSheet();y0=null;dy=0}}
function openPage(title,body,onMount,opts={}){
  const pg=$('page');pg.innerHTML=(opts.bare?'':`<div class="pg-h"><button class="back" data-back>${svg('chev')}Home</button><h3 class="cap">${title}</h3>${opts.right||''}</div>`)+body;
  pg.scrollTop=0;pg.classList.add('on');UI.page=true;syncCtl();pg.querySelectorAll('[data-back]').forEach(b=>b.onclick=closePage);onMount&&onMount(pg);
}
function closePage(){$('page').classList.remove('on');UI.page=false;if(!UI.sheet)$('scrim').classList.remove('on');syncCtl()}
$('scrim').onclick=()=>{if(UI.sheet)closeSheet()};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(UI.sheet)closeSheet();else if(UI.wa)closeWatch();else if(UI.page)closePage()});
function syncCtl(){$('ctl').classList.toggle('hide',!!(UI.sheet||UI.page||UI.wa))}
function toast(t){$('toastT').textContent=t;$('toast').classList.add('on');clearTimeout(UI.tt);UI.tt=setTimeout(()=>$('toast').classList.remove('on'),2400)}

const dueCount=()=>(state.lineup?0:1)+(state.banish?0:1);
function heroPick(){const due=SHOWS.filter(s=>s.need&&!(s.id==='surv'&&state.lineup)&&!(s.id==='trt'&&state.banish));const pool=due.length?due:mine();return pool.slice().sort((a,b)=>nextAir(a.air)-nextAir(b.air))[0].id}

// ---------- the guide ----------
function listings(){const out=[];const t0=startOfToday();
  for(let d=0;d<7;d++){const date=new Date(t0);date.setDate(t0.getDate()+d);const wd=date.getDay();
    SHOWS.forEach(s=>{if(window.GUIDE_ONLY&&!GUIDE_ONLY.includes(s.id))return;const days=s.nightly||[s.air[0]];if(!days.includes(wd))return;const at=new Date(date);at.setHours(s.air[1],s.air[2],0,0);out.push({s,at,d,ep:s.ep+(s.nightly?d:0)})})}
  return out}
function guideDays(clone){const L=listings(),now=new Date();let html='';
  for(let d=clone?1:0;d<7;d++){const date=new Date(startOfToday());date.setDate(date.getDate()+d);
    const items=L.filter(x=>x.d===d).sort((a,b)=>a.at-b.at);const groups=[];items.forEach(x=>{const g=groups.find(g=>+g[0].at===+x.at);g?g.push(x):groups.push([x])});
    let body='',nowDone=d!==0;
    groups.forEach(g=>{if(!nowDone&&g[0].at>now){body+=`<div class="nowln">Now ${clock(now)}</div>`;nowDone=true}
      body+=g.length>1?`<div class="clash"><em><span>Same time</span><span>${clock(g[0].at)}</span></em>${g.map(card).join('')}</div>`:card(g[0])});
    if(!nowDone&&items.length)body+=`<div class="nowln">Now ${clock(now)}</div>`;
    if(!items.length)body+=d===0?nextUpCard(L):`<div class="quiet">Nothing on</div>`;
    html+=`<div class="day${d===0?' today':''}"${clone?' aria-hidden="true"':''}><div class="dh"${d===0?' id="todayH"':''}><b>${d===0?(now.getHours()>=17?'Tonight':'Today'):d===1?'Tomorrow':DAY[date.getDay()]}</b><span>${d<2?DAY[date.getDay()]+' ':''}${MON[date.getMonth()]} ${date.getDate()}</span></div>${body}</div>`}
  return html}
function nextUpCard(L){const nx=L.filter(x=>x.d>0).sort((a,b)=>a.at-b.at)[0];if(!nx)return `<div class="quiet">Nothing on</div>`;const s=nx.s;
  return `<button class="lst nextup" data-show="${s.id}" data-ep="${nx.ep}" data-at="${fmtT(nx.at)}"><img src="${ART(s.art)}" alt="" style="object-position:${s.pos}"><span class="tm">Nothing tonight</span><span class="nx cap">Next up</span><span class="tt">${s.name}</span><span class="ep"><span>${fmtT(nx.at)}</span></span></button>`}
function card(x){const s=x.s,w=watchersOf(s)||[],now=Date.now(),live=now>=+x.at&&now<+x.at+60*60e3,watchOnly=s.explore||s.series||s.others;
  return `<button class="lst${watchOnly?' watch':''}${s.id===sel?' sel':''}${live?' live':''}" data-show="${s.id}" data-ep="${x.ep}" data-at="${fmtT(x.at)}" aria-label="${s.name}, ${fmtT(x.at)}, episode ${x.ep}">
    <img src="${ART(s.art)}" alt="" loading="lazy" style="object-position:${s.pos}">
    ${s.need&&!watchOnly?'<span class="nd"></span>':''}<span class="tm">${live?'On now':clock(x.at)}</span>
    <span class="tt">${s.name}</span><span class="ep"><span>${s.season.replace('Season ','S')} · Ep ${x.ep}</span><span class="f">${w.slice(0,4).map(n=>`<span style="background:${col(n)}">${n[0].toUpperCase()}</span>`).join('')}</span></span></button>`}

// ---------- hero ----------
function heroHTML(anim){const s=SHOWS.find(x=>x.id===sel),t=nextAir(s.air);
  const done=(s.id==='surv'&&state.lineup)||(s.id==='trt'&&state.banish);
  const crowd=watchersOf(s)||crowdOf();const [a,b]=s.set?(N===4?s.set:s.set12):[crowd.length,N];const aa=done?a+1:a;
  const td=s.todo||{kind:'Add',t:'Add it to your shows',d:'riley watches it'};
  const tgCls=done?'good':s.explore?'q':s.others?'q':'';
  const line=s.explore||s.series||s.others?`${crowd.length} of ${N} watching`:`${aa} of ${b} ${s.id==='trt'?'have picked':'lineups set'}`;
  return `<div class="hero${anim?' swap':''}"><div class="art"><img src="${ART(s.art)}" alt="" style="object-position:${s.hpos||s.pos}"></div>
    <div class="in"><div class="onnext"><span class="tg cap">Up next</span><span>${s.season} · Ep ${s.ep} · ${fmtT(t)}</span></div>
      <h1 class="cap">${s.kinds?`<a href="#/show/${s.id}/tonight" class="hlink">${s.name}${svg('chev')}</a>`:s.name}</h1>
      <div class="cd" id="cd" data-t="${t.getTime()}">${['d','h','m','s'].map((u,i)=>`${i?'<span class="sep">:</span>':''}<span class="u"><b data-u="${u}">00</b><small>${{d:'days',h:'hrs',m:'min',s:'sec'}[u]}</small></span>`).join('')}</div>
      <button class="todo" id="todo"><span class="tg cap ${tgCls}">${done?'Done':td.kind}</span><span class="bd"><span class="t cap">${done?td.done:td.t}</span><span class="d">${done?td.doneD:td.d}</span></span><span class="go">${svg('chev')}</span></button>
      <div class="hfoot"><div class="crowd"><span class="stack">${crowd.slice(0,6).map(n=>av(n,24)).join('')}${crowd.length>6?`<span class="av more">+${crowd.length-6}</span>`:''}</span>${line}</div>${s.others&&!state.added.has(s.id)?'':`<button class="wabtn" id="heroWA">${svg('tv')}Watch along</button>`}</div></div></div>`}
function swapHero(){$('heroWrap').innerHTML=heroHTML(true);prevCd={};tickCd();$('todo').onclick=heroAction;if($('heroWA'))$('heroWA').onclick=()=>openWatch(sel);document.querySelectorAll('.lst').forEach(x=>x.classList.toggle('sel',x.dataset.show===sel))}
function heroAction(){const s=SHOWS.find(x=>x.id===sel);
  if(s.id==='surv')return lineupSheet();if(s.id==='trt')return banishSheet();if(s.series)return openWatch('bd');if(s.explore)return whereSheet(s);if(s.others)return addShowSheet()}

  if(s.explore||s.others)return `<div class="poster${s.others?' pop':''}" data-poster="${s.id}"><button class="face front" data-open="${s.id}" aria-label="${s.name}, explore"><img src="${ART(s.art)}" alt="" style="object-position:${s.pos}"><span class="glare"></span><span class="badge cap ex">${s.others?'Just added':'Watching · Ep '+s.onEp}</span><span class="ttl cap">${s.name.replace('The ','')}</span><span class="sn">${s.season} · ${DAY[s.air[0]]}</span><span class="games"><span>Not playing yet</span></span></button></div>`;
  const idx=N===4?0:1,places=s.games.map(g=>g[2][idx]),best=places.map(p=>parseInt(p)).sort((a,b)=>a-b)[0];
  return `<div class="poster" data-poster="${s.id}">

    <div class="face rear"><div class="bt"><b class="cap">${s.short}</b><button class="unflip" data-unflip aria-label="Flip back">${svg('flip')}</button></div>
      ${s.games.map((g,i)=>`<button class="gm" data-league="${s.id}:${i}"><span>${g[0]}<small>${g[1]} · ${N} players</small></span><span class="pl num${g[2][idx]==='1st'?' first':''}">${g[2][idx]}</span></button>`).join('')}
      <div class="rearbtns"><button class="open" data-league="${s.id}:0">Open</button><button class="open wa2" data-wa="${s.id}">${svg('tv')}Watch</button></div></div></div>`}

// ---------- rankings ----------
let rankTab='year';
function rankPane(){const pr=N===4?PR4:PR12,tot=r=>r[1]+r[2]+r[3],max=Math.max(...pr.map(tot)),ranked=pr.slice().sort((a,b)=>tot(b)-tot(a)),myI=ranked.findIndex(r=>r[0]==='alex'),lead=ranked[0];
  const online=N===4?['riley','jordan']:['riley','priya','dev','maya','luis'];
  if(rankTab==='year'){const show=ranked.length>6?[...ranked.slice(0,5),'gap',ranked[myI]].filter((r,i,a)=>!(r==='gap'&&myI<5)&&a.indexOf(r)===i):ranked;
    return show.map(r=>{if(r==='gap')return `<div class="gapline">${ranked.length-6} more</div>`;const i=ranked.indexOf(r),t=tot(r),me=r[0]==='alex';

const REACT_KINDS={fire:'#f2804b',laugh:'#ffc531',eye:'#a76bb0',crown:'#35b5a5'};
const reactionsFor=d=>{const out=[];const ppl=['riley','jordan','sam'];for(let t=d.start-60;t<d.start+600;t+=7+((t*13)%11))out.push([t,ppl[t%3],Object.keys(REACT_KINDS)[(t>>2)%4]]);return out};
let wa={};

  <div class="ctrls"><button id="waBack">−10s</button><button class="pp" id="waPP">${svg('pause')}Pause</button><button class="adb" id="waAd" style="visibility:hidden">${svg('tv')}Ad break</button></div>

function setMode(m){$('wa').querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x.dataset.m===m));$('waAd').style.visibility=m==='live'?'visible':'hidden'}
function closeWatch(){cancelAnimationFrame(wa.raf);$('wa').classList.remove('on');UI.wa=false;syncCtl()}
const fmtRT=t=>`${(t/60|0)}:${String(t%60|0).padStart(2,'0')}`;
function addCm(ts,n,txt,me){const ul=$('waS');const li=document.createElement('li');li.className='cm'+(me?' mine':'');li.innerHTML=`${av(n,30)}<div><div class="h"><b>${n}</b><span>at ${fmtRT(ts)}</span>${n==='riley'?'<span class="lv">· watching now</span>':''}</div><p>${txt}</p></div>`;ul.appendChild(li);while(ul.children.length>6)ul.firstChild.remove()}
// a reaction sticker: a cast photo with a caption, punched in like a GIF
function addSticker(ts,n,castName,cap,me){const c=wa.d.cast&&by(wa.d.cast,castName.split(' ')[0]);if(!c)return;const ul=$('waS');const li=document.createElement('li');li.className='cm sticker'+(me?' mine':'');
  li.innerHTML=`${av(n,30)}<div><div class="h"><b>${n}</b><span>at ${fmtRT(ts)}</span></div><figure class="gif"><img src="${ph(c)}" alt="${c.name}"><figcaption class="cap">${cap}</figcaption></figure></div>`;ul.appendChild(li);while(ul.children.length>6)ul.firstChild.remove()}
function floatRx(n,k,me){const box=$('waRx');if(!box)return;const b=document.createElement('span');b.className='fx'+(me?' me':'');b.style.left=(55+Math.random()*35)+'%';b.style.setProperty('--c',REACT_KINDS[k]);b.style.setProperty('--sway',(Math.random()*40-20)+'px');
  b.innerHTML=`${svg(k)}<i style="background:${col(n)}">${n[0].toUpperCase()}</i>`;box.appendChild(b);setTimeout(()=>b.remove(),2600)}
function stickerPicker(){const picks=wa.d.cast.cast.filter(c=>c.photo&&!c.exitEp).slice(0,6),caps=['Me right now','Called it','Not again','Blindside face','Iconic','Shook'];
  openSheet('Send a sticker',`At ${fmtRT(wa.t)} · the couch sees it when they reach this moment`,`<div class="cast4" style="grid-template-columns:repeat(3,1fr)">${picks.map((c,i)=>`<button class="tile gifpick" data-g="${i}"><img src="${ph(c)}" alt=""><div class="cap" style="font-size:13px">${caps[i]}</div></button>`).join('')}</div>`,
    b=>b.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{const i=+x.dataset.g;closeSheet();addSticker(wa.t,'alex',picks[i].name,caps[i],true)}))}
function paintWA(jump){const d=wa.d,R=wa.RUN;$('waT').textContent=fmtRT(wa.t);$('waF').style.width=(wa.t/R*100)+'%';$('waMe').style.left=(wa.t/R*100)+'%';$('waJ').style.left=(Math.min(R,wa.t+40)/R*100)+'%';$('waIn').placeholder=`Say something at ${fmtRT(wa.t)}`;
  $('waPk').innerHTML=d.lines.map(l=>l[0]).filter(x=>x+SAFETY<=wa.t).map(x=>`<span class="pk" style="left:${x/R*100}%"></span>`).join('');
  if(jump){$('waS').innerHTML='';wa.shown=wa.shownSt=0;wa.shownRx=wa.rx.findIndex(r=>r[0]+SAFETY>wa.t);if(wa.shownRx<0)wa.shownRx=wa.rx.length}
  while(wa.shown<d.lines.length&&d.lines[wa.shown][0]+SAFETY<=wa.t){const [ts,n,txt]=d.lines[wa.shown++];if(!jump||wa.t-ts<SAFETY+90)addCm(ts,n,txt)}
  while(wa.shownSt<d.stickers.length&&d.stickers[wa.shownSt][0]+SAFETY<=wa.t){const [ts,n,c,cap]=d.stickers[wa.shownSt++];if(!jump||wa.t-ts<SAFETY+90)addSticker(ts,n,c,cap)}
  while(wa.shownRx<wa.rx.length&&wa.rx[wa.shownRx][0]+SAFETY<=wa.t){const [,n,k]=wa.rx[wa.shownRx++];if(!jump)floatRx(n,k)}}
function loopWA(){cancelAnimationFrame(wa.raf);const step=now=>{const dt=wa.last?(now-wa.last)/1000:0;wa.last=now;if(wa.run&&!wa.ad){wa.t+=dt*3;if(wa.t>=wa.RUN){wa.t=wa.RUN;wa.run=false;$('waRate').classList.add('on')}}paintWA(false);wa.raf=requestAnimationFrame(step)};wa.raf=requestAnimationFrame(step)}

function episodeSheet(sid,ep,at){const s=SHOWS.find(x=>x.id===sid),w=watchersOf(s)||[],playing=!(s.explore||s.series||s.others),added=!s.others||state.added.has(s.id);
  const task=sid==='surv'?(state.lineup?['Lineup set','Change it','lineup']:['Set your lineup','1 open slot','lineup']):sid==='trt'?(state.banish?['Pick in','Change it','banish']:['Predict','Who gets banished?','banish']):s.explore?['Explore','Stats up to your episode','explore']:null;
  openSheet(s.name,`${s.season} · Episode ${ep} · ${at}`,
    `<div class="recap-art" style="height:170px"><img src="${ART(s.art)}" alt="" style="object-position:${s.hpos||s.pos}"><b class="cap">Episode ${ep}</b></div>
     <div class="watchers" style="margin:0 0 14px"><span class="stack">${w.map(n=>av(n,24)).join('')}</span>${w.length} of ${N} on the couch watch this</div>
     ${added?`<button class="row" data-act="watch"><span class="ic" style="background:var(--good);color:var(--good-ink)">${svg('tv')}</span><span class="tx"><b>Watch along</b><small>The couch's comments and reactions, in sync with you</small></span>${svg('chev')}</button>`:''}
     ${task?`<button class="row" data-act="${task[2]}"><span class="ic">${svg(task[2]==='explore'?'eye':'lineup')}</span><span class="tx"><b>${task[0]}</b><small>${task[1]}</small></span>${svg('chev')}</button>`:''}
     ${s.kinds?`<a class="row" href="#/show/${sid}/tonight" data-act="open"><span class="ic" style="background:var(--bone);color:var(--ink)">${svg('chev')}</span><span class="tx"><b>Open ${s.short}</b><small>Tonight, standings, cast and chat</small></span></a>`:''}
     <button class="row" data-act="bingo"><span class="ic">${svg('bingo')}</span><span class="tx"><b>Episode bingo</b><small>A fresh card for this episode</small></span>${svg('chev')}</button>
     <button class="row" data-act="remind"><span class="ic">${svg('bell')}</span><span class="tx"><b>Remind me</b><small>10 minutes before it airs</small></span></button>
     ${added?'':`<button class="btn pri wide" data-act="add" style="margin-top:12px">${svg('plus')}Add to your shows</button>`}

    b=>b.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>{const a=x.dataset.act;
      if(a==='remind'){x.querySelector('small').textContent='Set · we\'ll nudge you at '+at;x.querySelector('.ic').style.background='var(--chyron)';x.querySelector('.ic').style.color='var(--ink)';return}
      if(a==='open'){closeSheet();return}closeSheet();setTimeout(()=>{if(a==='watch')openWatch(sid);else if(a==='lineup')lineupSheet();else if(a==='banish')banishSheet();else if(a==='explore')whereSheet(s);else if(a==='bingo')bingoSheet();
        else if(a==='add'){state.added.add(sid);refreshShelf();toast(`${s.name} added to your shows`)}else if(a==='hero'){sel=sid;swapHero();$('heroWrap').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})}},260)}))}

const app=$('app');
function render(){closeSheet();closePage();if(UI.wa)closeWatch();if(N===0){location.hash='#/welcome';return}if(N===1){app.innerHTML=soloHub();wireSolo();return}window.GUIDE_ONLY=null;app.innerHTML=hub();wireHub()}

function wireHub(){
  $('bell').onclick=notesSheet;$('meBtn').onclick=profileSheet;
  $('addShow').onclick=$('addShow2').onclick=addShowSheet;$('todo').onclick=heroAction;if($('heroWA'))$('heroWA').onclick=()=>openWatch(sel);
  // the guide
  app.querySelectorAll('.lst').forEach(b=>b.onclick=()=>{if(UI.dragged)return;episodeSheet(b.dataset.show,b.dataset.ep,b.dataset.at)});
  startReel();wirePosters();
  // rankings
  $('rankTabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{rankTab=b.dataset.t;$('rankTabs').querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));paintRank(true)});
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){paintRank(false);io.disconnect()}}),{threshold:.2});$('rankPane').innerHTML=rankPane();io.observe($('rankPane'));
  requestAnimationFrame(()=>{const tabs=$('rankTabs'),on=tabs.querySelector('.on'),pill=tabs.querySelector('.pill');pill.style.width=on.offsetWidth+'px';pill.style.left='3px';pill.style.transform=`translateX(${on.offsetLeft-3}px)`});
  $('allRank').onclick=allRankSheet;$('openChat').onclick=chatPage;
  $('feed').onclick=e=>{const b=e.target.closest('.reacts button');if(!b)return;const m=b.classList.toggle('mine');b.setAttribute('aria-pressed',m);const c=b.querySelector('span');c.textContent=+c.textContent+(m?1:-1);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')};
  app.querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>({bingo:bingoSheet,poll:pollSheet,trivia:triviaSheet,party:partySheet,wa:()=>openWatch('surv')})[b.dataset.mini]());
  app.querySelectorAll('[data-past]').forEach(b=>b.onclick=()=>pastSheet(+b.dataset.past));$('allSeasons').onclick=seasonsPage;
  $('newLeague').onclick=newLeagueSheet;$('joinCouch').onclick=joinSheet;prevCd={};tickCd();
  app.querySelectorAll('.shelf,.minis,.trophies').forEach(hscroll)}
function hscroll(el){if(!el||el.dataset.hs)return;el.dataset.hs=1;let x0=null,s0=0,moved=0;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button)return;x0=e.clientX;s0=el.scrollLeft;moved=0});
  addEventListener('pointermove',e=>{if(x0===null)return;const dx=e.clientX-x0;moved=Math.max(moved,Math.abs(dx));if(moved>4){el.classList.add('dragging');el.scrollLeft=s0-dx}});
  addEventListener('pointerup',()=>{if(x0===null)return;x0=null;setTimeout(()=>el.classList.remove('dragging'),0);if(moved>4){const kill=ev=>{ev.stopPropagation();ev.preventDefault()};el.addEventListener('click',kill,{capture:true,once:true});setTimeout(()=>el.removeEventListener('click',kill,{capture:true}),50)}});
  el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){const atEnd=(e.deltaY>0&&el.scrollLeft+el.clientWidth>=el.scrollWidth-1)||(e.deltaY<0&&el.scrollLeft<=0);if(!atEnd){el.scrollLeft+=e.deltaY;e.preventDefault()}}},{passive:false})}
function refreshShelf(){const add=$('shelf').querySelector('.poster.add').outerHTML;$('shelf').innerHTML=mine().map(poster).join('')+add;$('addShow').onclick=addShowSheet;wirePosters()}
function wirePosters(){app.querySelectorAll('.poster:not(.add)').forEach(p=>{

  p.querySelectorAll('[data-league]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [sid,gi]=b.dataset.league.split(':');leaguePage(sid,+gi)});
  const o=p.querySelector('[data-open]');if(o)o.onclick=()=>{const s=SHOWS.find(x=>x.id===o.dataset.open);s.series?openWatch('bd'):whereSheet(s)};
  if(reduce)return;
  p.onpointermove=e=>{if(p.classList.contains('flip')||e.pointerType==='touch')return;const r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;p.style.transition='transform .1s';p.style.transform=`rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*14}deg)`;f.style.setProperty('--gx',x*100+'%');f.style.setProperty('--gy',y*100+'%')};
  p.onpointerleave=()=>{p.style.transition='';p.style.transform=''}})}
function wireNewbie(){const r=$('roll'),names=['Survivor','The Traitors','The Challenge','Love Island','your show'];let i=0;clearInterval(UI.rt);

  $('nbJoin').onclick=joinSheet;$('nbNew').onclick=newLeagueSheet;$('nbSign').onclick=()=>toast('Sign in lives at /sign-in in the app')}

// the reel: rolls, pauses for any touch, resumes after 4s idle; mouse can drag it
let reel={};
function startReel(){const r=$('reel'),st=$('rolling');cancelAnimationFrame(reel.raf);reel={paused:false,idle:0,last:0,pos:0};
  const pause=()=>{reel.paused=true;reel.idle=performance.now();st.classList.add('paused');st.lastChild.textContent='Paused'};
  ['pointerdown','wheel','touchstart','focusin','mouseenter'].forEach(ev=>r.addEventListener(ev,pause,{passive:true}));
  r.addEventListener('scroll',()=>{if(reel.paused)reel.idle=performance.now()},{passive:true});
  let dx=null,moved=0;r.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dx=e.clientX+r.scrollLeft;moved=0;r.classList.add('drag')});
  addEventListener('pointermove',e=>{if(dx===null)return;const nx=dx-e.clientX;moved+=Math.abs(nx-r.scrollLeft);r.scrollLeft=nx});
  addEventListener('pointerup',()=>{if(dx===null)return;dx=null;r.classList.remove('drag');UI.dragged=moved>6;setTimeout(()=>UI.dragged=false,0)});
  const half=()=>{const t=r.querySelector('.day.today');return (r.scrollWidth-(t?t.offsetWidth:0))/2};
  const th=$('todayH');if(th)th.onclick=()=>{reel.pos=0;r.scrollTo({left:0,behavior:'smooth'})};
  const step=t=>{const dt=reel.last?Math.min(t-reel.last,50):16;reel.last=t;
    if(reel.paused&&t-reel.idle>4000&&!r.matches(':hover')&&dx===null){reel.paused=false;st.classList.remove('paused');st.lastChild.textContent='Rolling'}
    if(!reel.paused&&!reduce){reel.pos+=dt*.022;if(reel.pos>=half())reel.pos-=half();r.scrollLeft=reel.pos}else reel.pos=r.scrollLeft;
    reel.raf=requestAnimationFrame(step)};reel.raf=requestAnimationFrame(step)}

let prevCd={};
function tickCd(){const cd=$('cd');if(!cd)return;let s=Math.max(0,(+cd.dataset.t-Date.now())/1000|0);const v={d:s/86400|0,h:(s%86400)/3600|0,m:(s%3600)/60|0,s:s%60};
  cd.querySelectorAll('b').forEach(b=>{const u=b.dataset.u,t=String(v[u]).padStart(2,'0');if(prevCd[u]!==t){b.textContent=t;if(prevCd[u]!==undefined&&!reduce){b.classList.remove('fl');void b.offsetWidth;b.classList.add('fl')}prevCd[u]=t}})}
