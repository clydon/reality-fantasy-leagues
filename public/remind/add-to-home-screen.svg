<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 120" font-family="system-ui,sans-serif">
  <!-- Placeholder for the generated Add to Home Screen picture (src/new/show/remind.tsx ADD_TO_HOME_ART): three panels, no
       labels (the sheet writes them). -->
  <defs>
    <g id="share"><path d="M-5 0v6a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 5 6V0M3-4l-3-3-3 3M0-7v9" fill="none" stroke="#cfcbe0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>

  <!-- 1: Safari's toolbar, Share ringed -->
  <rect width="120" height="120" rx="6" fill="#0f0d16"/>
  <rect x="10" y="12" width="60" height="10" rx="2" fill="#3a3548"/>
  <rect x="10" y="30" width="100" height="7" rx="2" fill="#26223a"/>
  <rect x="10" y="43" width="80" height="7" rx="2" fill="#26223a"/>
  <rect x="10" y="56" width="45" height="7" rx="2" fill="#26223a"/>
  <rect y="88" width="120" height="32" fill="#232030"/>
  <path d="M19 99l-5 5 5 5M41 99l5 5-5 5" fill="none" stroke="#cfcbe0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#share" x="75" y="105"/>
  <rect x="97" y="98" width="11" height="11" rx="2" fill="none" stroke="#cfcbe0" stroke-width="1.4"/>
  <circle cx="75" cy="103" r="12" fill="none" stroke="#ffc531" stroke-width="2.5"/>
  <circle cx="75" cy="103" r="16" fill="none" stroke="#ffc531" stroke-opacity=".25" stroke-width="4"/>

  <!-- 2: the share sheet, Add to Home Screen ringed -->
  <g transform="translate(126 0)">
    <rect width="120" height="120" rx="6" fill="#0f0d16"/>
    <g font-size="9" font-weight="600" fill="#cfcbe0">
      <rect x="8" y="10" width="104" height="18" rx="4" fill="#232030"/><text x="14" y="22">Copy</text>
      <rect x="8" y="32" width="104" height="18" rx="4" fill="#232030"/><text x="14" y="44">Add Bookmark</text>
      <rect x="8" y="54" width="104" height="20" rx="4" fill="#fff" stroke="#ffc531" stroke-width="2.5"/>
      <text x="13" y="67" fill="#121018" font-size="8.2">Add to Home Screen</text>
      <rect x="97" y="58.5" width="10" height="10" rx="2" fill="none" stroke="#121018" stroke-width="1.3"/>
      <path d="M102 61v5M99.5 63.5h5" stroke="#121018" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="8" y="78" width="104" height="18" rx="4" fill="#232030"/><text x="14" y="90">Markup</text>
      <rect x="8" y="100" width="104" height="14" rx="4" fill="#232030" opacity=".6"/>
    </g>
  </g>

  <!-- 3: the Home Screen, the app's icon ringed -->
  <g transform="translate(252 0)">
    <rect width="120" height="120" rx="6" fill="#0f0d16"/>
    <g fill="#2c2840">
      <rect x="14" y="14" width="24" height="24" rx="6"/><rect x="48" y="14" width="24" height="24" rx="6"/><rect x="82" y="14" width="24" height="24" rx="6"/>
      <rect x="14" y="48" width="24" height="24" rx="6"/><rect x="82" y="48" width="24" height="24" rx="6"/>
      <rect x="14" y="82" width="24" height="24" rx="6"/><rect x="48" y="82" width="24" height="24" rx="6"/><rect x="82" y="82" width="24" height="24" rx="6"/>
    </g>
    <rect x="48" y="48" width="24" height="24" rx="6" fill="#ffc531" stroke="#fff" stroke-width="2.5"/>
    <text x="60" y="63.5" text-anchor="middle" font-size="8" font-weight="800" fill="#121018">GYS</text>
