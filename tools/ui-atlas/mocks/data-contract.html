<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas mock data contract</title><style>body{font:14px/1.6 system-ui,sans-serif;background:#16141d;color:#f4f2f8;padding:20px;margin:0}h1{font-size:23px;line-height:1.2}p{color:#bcb6ca}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;border-top:1px solid #655c76;padding-top:14px}button{min-height:44px;background:#221f2c;color:inherit;border:1px solid #655c76;border-radius:4px;padding:8px 12px;cursor:pointer}</style></head><body><h1>Same data, a separate mock</h1><p>This is a data-contract example, not a proposed app layout.</p><p id="case">Loading case…</p><button id="inspect">Inspect the supplied home data</button><pre id="output"></pre><script>fetch('/__atlas/data').then(r=>r.json()).then(d=>{document.getElementById('case').textContent=d.case.title+' · '+d.case.dataKind;document.getElementById('inspect').onclick=()=>{const home=d.responses['/api/me/home']?.body;document.getElementById('output').textContent=JSON.stringify({context:d.context,shows:home?.shows?.map(s=>({name:s.show.name,seenThrough:s.seenThrough,games:s.games.length})),couches:home?.couches?.length,moves:home?.moves?.length},null,2);};}).catch(e=>document.getElementById('case').textContent=e.message);</script></body></html>
