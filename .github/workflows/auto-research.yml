# Scheduled episode research (db/auto-research.js), then episode reminders (db/reminders.js): about a
# day and two hours before an episode airs, a push to anyone whose lineup, pick or a prediction for it
# is still open. Then the waiver clock (db/waivers.js): mid-season waiver weeks processed on time, and
# their reminders. Both need the push keys below; without them the steps run and send nothing.
#
# Scheduled episode research (db/auto-research.js). Each season with auto-research switched on in
# Admin > Shows & Seasons has its own weekly slot ("Thursdays at noon Eastern"); this job runs hourly
# and researches whatever episode's slot has come round. Results are staged for admin review, never
# applied to a league by themselves.
#
# Hourly is the schedule's resolution -- a noon slot is picked up by the first run after noon (GitHub
# can start scheduled jobs a few minutes late). A run with nothing due exits in seconds and costs
# nothing.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   AUTH_DATABASE_URL   -- the production database, same as the wiki-sync job.
#   ANTHROPIC_API_KEY   -- research calls Claude with web search.
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT -- the same Web Push keys the app
#                          uses (Vercel env), for the reminders step.
#   GEMINI_API_KEY      -- optional: only if RESEARCH_PROVIDER is set to gemini. Indexing the answers
#                          for side-bet suggestions needs no key: it runs a local model (db/embeddings.js),
#                          fetched on first use below.
name: Auto research

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Run auto-research.js
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node db/auto-research.js

      # Its own step, and run even if research failed: a provider outage shouldn't cost anyone their
      # lineup reminder.
      - name: Run reminders.js
        if: ${{ !cancelled() }}
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node db/reminders.js

      # Mid-season waivers' clock (docs/PLAN-midseason-waivers.md): processes the weeks whose time has
      # come in leagues nobody has loaded since, announces them, and sends the reminders six hours before.
      - name: Run waivers.js
        if: ${{ !cancelled() }}
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node db/waivers.js
