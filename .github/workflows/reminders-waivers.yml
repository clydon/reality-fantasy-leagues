# Episode reminders (db/reminders.js): about a day and two hours before an episode airs, a push to anyone whose lineup, pick or a
# prediction for it is still open, and the morning after, a push to commissioners whose game still has no results. Then the
# waiver clock (db/waivers.js): mid-season waiver weeks processed on time in leagues nobody has loaded since, and their reminders
# six hours before.
#
# Hourly is the resolution: each reminder is sent at most once (reminder_log), so running more often only makes them more
# punctual. A run with nothing due exits in seconds.
#
# Then sports results (db/sports-refresh.js, docs/PLAN-sports-ready.md step 1.1): the sports part of the daily listings job each
# hour, so a game's final is in the standings within the hour (ESPN's public API, no key; the daily job stays the fallback).
#
# This job used to run paid Claude research first (db/auto-research.js, "Auto research"); that went with classic's admin
# (docs/PLAN-desk-parity.md, decision 9 and step 8, part 8b). Our bot researches now, on the VM's tick (docs/HOSTING.md).
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   AUTH_DATABASE_URL   -- the production database.
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT -- the same Web Push keys the app uses (Vercel env).
#                          Without them both steps run and send nothing.
# And, for the live previews' sweep, this repository variable (not a secret: the address is public):
#   PREVIEW_SERVICE_URL -- the preview service's address (docs/PLAN-preview-release.md, step 7). Unset, the step is skipped.
name: Reminders and waivers

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  reminders-waivers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
        env:
          # See .npmrc: the onnxruntime CUDA download 404s; the CPU binaries ship in the package.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Run reminders.js
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node db/reminders.js

      # Its own step, and run even if reminders failed: one job's outage shouldn't hold up a waiver week.
      - name: Run waivers.js
        if: ${{ !cancelled() }}
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node db/waivers.js

      # Its own step too: ESPN being down or slow never holds up the reminders or a waiver week.
      - name: Run sports-refresh.js
        if: ${{ !cancelled() }}
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
        run: node db/sports-refresh.js

      # Live previews' sweep (docs/PLAN-preview-release.md, step 7): any preview past its time goes, and any copy older than the
      # longest a preview lives, even one the registry never knew. The route is open (it only removes what's due) and does it at
      # most once a minute; nothing here needs the service's database.
      - name: Sweep live previews
        if: ${{ !cancelled() && vars.PREVIEW_SERVICE_URL != '' }}
        run: curl -fsS -X POST "${{ vars.PREVIEW_SERVICE_URL }}/api/preview-live/sweep"
