# Nightly wiki connector run: extracts every (show, season) any league is currently tracking, ONCE
# each, and fans the result out to every league on it -- see db/wiki-sync.js's `all` command and
# db/migrations/0009_wiki_extractions_and_items.sql for why that split exists.
#
# Runs as a plain CI job rather than a Vercel Cron route deliberately -- wiki-sync.js is a standalone
# Node script with its own direct Postgres connection (same shape as db/migrate.js), not an HTTP
# handler, and a multi-league batch can run for a while. Porting it into a serverless route would
# mean adding request auth and reworking it around a request/response lifecycle it was never built
# for, for no benefit over just running the script as-is here.
#
# Needs two repository secrets, set under Settings > Secrets and variables > Actions:
#   AUTH_DATABASE_URL   -- same connection string as .env.local's, pointed at the production DB.
#   ANTHROPIC_API_KEY   -- extraction uses Claude; without this every run fails at the first model call.
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
#                       -- same values as the app's; lets the job push "results ready to review" to
#                          commissioners. Optional: without them the sync runs normally, just silently.
name: Wiki connector sync

on:
  schedule:
    # 13:00 UTC = 8/9am US Eastern -- after a US-timezone episode's overnight wiki edits have
    # settled, before anyone's likely to be checking the app for the day's results.
    - cron: "0 13 * * *"
  # Lets a commissioner (or you) trigger a run on demand from the Actions tab, without needing wiki
  # season/API changes to have happened first.
  workflow_dispatch:
    inputs:
      force:
        description: "Re-read every season even if its wiki revisions haven't changed"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Run wiki-sync.js all
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node db/wiki-sync.js all ${{ inputs.force && '--force' || '' }}
